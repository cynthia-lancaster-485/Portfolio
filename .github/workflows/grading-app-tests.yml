name: Grading App tests

on:
  push:
    paths: ["Grading App/**", ".github/workflows/grading-app-tests.yml"]
  pull_request:
    paths: ["Grading App/**", ".github/workflows/grading-app-tests.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Grading App"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py test grades
